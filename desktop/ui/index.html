<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DFlow</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #16181d; color: #e8eaf0;
      font-family: "Segoe UI", system-ui, sans-serif; }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      padding: 24px; box-sizing: border-box; text-align: center; }
    .logo { width: 84px; height: 84px; border-radius: 22px; background: linear-gradient(135deg, #ff6a2b, #ff9a3c);
      display: grid; place-items: center; font-size: 48px; font-weight: 800; color: #fff;
      box-shadow: 0 10px 40px rgba(255, 106, 43, 0.35); }
    h1 { margin: 0; font-size: 28px; letter-spacing: 2px; }
    p { margin: 0; color: #a7adbb; font-size: 16px; line-height: 1.55; max-width: 560px; }
    .ring { width: 34px; height: 34px; border-radius: 50%; border: 4px solid #2c313d; border-top-color: #ff6a2b;
      animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { display: none; border: 1px solid #5c2a2a; background: rgba(255, 80, 80, 0.08); border-radius: 12px; padding: 14px 18px; }
    .err p { color: #f0c0c0; }
    code { background: #23262f; padding: 2px 6px; border-radius: 6px; color: #ffd2b8; }
    button { margin-top: 6px; padding: 9px 18px; border-radius: 9px; border: 1px solid #3a4050; color: #fff;
      background: linear-gradient(180deg, #2c313d, #252a35); font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="logo">D</div>
    <h1>DFLOW</h1>
    <div class="ring" id="ring"></div>
    <p id="msg">Đang khởi động… (lần đầu sau khi cài có thể mất 20–40 giây)</p>
    <div class="err" id="err">
      <p>DFlow chưa khởi động được. Thử tắt hẳn DFlow (chuột phải biểu tượng DFlow ở góc dưới phải màn hình → <b>Thoát DFlow</b>) rồi mở lại.</p>
      <p>Vẫn không được: gửi file nhật ký <code id="logpath">DFlowData\logs\agent.log</code> cho người hỗ trợ.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </div>
  </main>
  <script>
    // The agent answers on 127.0.0.1:8434 once it is up; a no-cors request only tells whether it answers at all.
    const APP = "http://127.0.0.1:8434/";
    const started = Date.now();
    const hints = [
      [8000, "Đang khởi động phần xử lý của DFlow…"],
      [20000, "Đang chuẩn bị dữ liệu… (lần đầu lâu hơn một chút)"],
      [45000, "Sắp xong rồi, đợi thêm chút nữa…"],
    ];
    async function poll() {
      try {
        await fetch(APP + "api/health", { mode: "no-cors", cache: "no-store" });
        location.replace(APP);
        return;
      } catch (e) { /* not up yet */ }
      const waited = Date.now() - started;
      for (const [at, text] of hints) if (waited > at) document.getElementById("msg").textContent = text;
      if (waited > 120000) {
        document.getElementById("ring").style.display = "none";
        document.getElementById("msg").style.display = "none";
        document.getElementById("err").style.display = "block";
        return;
      }
      setTimeout(poll, 700);
    }
    // the shell tells where the log really is (the data folder sits on D: when the machine has one)
    if (window.__DFLOW_LOG__) document.getElementById("logpath").textContent = window.__DFLOW_LOG__;
    poll();
  </script>
</body>
</html>
