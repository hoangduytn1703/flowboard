[project]
name = "flowboard-agent"
version = "1.5.1"
description = "Flowboard local agent: FastAPI + SQLite + extension bridge"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "edge-tts>=7.0",
    "pillow>=10.0",
    # Gemini sparkle removal on generated images (services/watermark.py).
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    # Account data in the cloud (phase 1.5 B): Postgres (Neon) + S3 bucket (B2).
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "moto[s3]>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowboard"]

[tool.ruff]
line-length = 100
target-version = "py310"
