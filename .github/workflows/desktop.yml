# Builds the Windows installer of the DFlow desktop app (Tauri 2 shell + the agent: its own code compiled by Nuitka,
# bundled with its libraries by PyInstaller).
#
#   Actions → "Desktop app" → Run workflow   → the installer is attached to the run (Artifacts: DFlow-Setup)
#   a push to main that touches desktop/, agent/packaging/ or this file → same
#   bump "version" in desktop/src-tauri/tauri.conf.json (+ Cargo.toml), then
#   git tag v0.1.3 && git push origin v0.1.3 → same, plus a release on the PUBLIC repo hoangduytn1703/dflow-releases
#   (installer + latest.json): every installed app sees it and offers "⬇ Cập nhật ngay".
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) sign the update (the app only installs updates signed with the
# key whose public half is in tauri.conf.json — backup of the key: %USERPROFILE%\.flowboard\dflow-updater.key on the
# home machine); RELEASES_TOKEN may create releases on dflow-releases.
# No Rust / Visual Studio is needed on anyone's machine: windows-latest has both.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # a change to the app itself builds an installer too (Artifacts of the run)
    branches: [main]
    paths:
      - "desktop/**"
      - "agent/packaging/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # One version for everything (the sidebar shows frontend/package.json, the updater compares tauri.conf.json):
      # a release tag must match all of them — checked before the 13-minute build, not after it.
      - name: Version check (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $want = "${{ github.ref_name }}".TrimStart("v")
          $have = [ordered]@{
            "desktop/src-tauri/tauri.conf.json" = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            "desktop/src-tauri/Cargo.toml" = ([regex]::Match((Get-Content desktop/src-tauri/Cargo.toml -Raw), '(?m)^version = "([^"]+)"')).Groups[1].Value
            "frontend/package.json" = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
            "agent/pyproject.toml" = ([regex]::Match((Get-Content agent/pyproject.toml -Raw), '(?m)^version = "([^"]+)"')).Groups[1].Value
            # the agent checks it against the signed oldest-build-allowed (licensing.outdated)
            "agent/flowboard/__init__.py" = ([regex]::Match((Get-Content agent/flowboard/__init__.py -Raw), '__version__ = "([^"]+)"')).Groups[1].Value
          }
          $bad = $have.GetEnumerator() | Where-Object { $_.Value -ne $want }
          if ($bad) { throw "tag v$want does not match: " + (($bad | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ", ") }

      # ── 1. the agent → resources/agent/dflow-agent.exe ─────────────────────
      - uses: astral-sh/setup-uv@v6
      - name: Agent (Nuitka + PyInstaller)
        run: |
          uv venv --python 3.11 agent/.venv
          uv pip install --python agent/.venv/Scripts/python.exe -e agent pyinstaller nuitka ordered-set zstandard
          Push-Location agent
          # the agent's own code as machine code: the licence checks are not one decompile + edit away (packaging/dflow-agent.spec)
          .venv/Scripts/python.exe -m nuitka --module flowboard --include-package=flowboard --output-dir=../build/nuitka `
            --remove-output --assume-yes-for-downloads --msvc=latest --jobs=4 --lto=no
          $pyd = Get-ChildItem ../build/nuitka -Filter "flowboard*.pyd" | Select-Object -First 1
          if (-not $pyd) { throw "Nuitka built no flowboard*.pyd" }
          $env:DFLOW_COMPILED = $pyd.FullName
          .venv/Scripts/python.exe -m PyInstaller packaging/dflow-agent.spec --noconfirm `
            --distpath ../desktop/src-tauri/resources --workpath ../build/pyinstaller
          Pop-Location
          if (-not (Test-Path desktop/src-tauri/resources/agent/dflow-agent.exe)) { throw "dflow-agent.exe missing" }
          if (-not (Test-Path "desktop/src-tauri/resources/agent/_internal/$($pyd.Name)")) { throw "the compiled flowboard is not in the bundle" }

      # the compiled build must start and ask for a login (a Nuitka build that breaks at runtime never reaches a release)
      - name: Agent smoke test
        run: |
          $h = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/dflow-smoke"
          $env:FLOWBOARD_HOME = $h.FullName
          $env:FLOWBOARD_HTTP_PORT = "8534"
          $env:FLOWBOARD_EXT_WS_PORT = "8455"
          $p = Start-Process desktop/src-tauri/resources/agent/dflow-agent.exe -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try { $ok = (Invoke-WebRequest http://127.0.0.1:8534/api/health -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200 } catch {}
          }
          $me = 0
          try { Invoke-WebRequest http://127.0.0.1:8534/api/account/me -UseBasicParsing -TimeoutSec 5 | Out-Null } catch { $me = [int]$_.Exception.Response.StatusCode }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok -or $me -ne 401) {
            Get-Content "$($h.FullName)/logs/agent.log" -ErrorAction SilentlyContinue | Select-Object -Last 80
            throw "the packaged agent did not start properly (health ok: $ok, /api/account/me: $me — expected 401)"
          }
          Write-Host "packaged agent ok: health 200, login required"

      # ── 2. the web UI → resources/web ──────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Web UI (Vite build)
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend
          Copy-Item frontend/dist desktop/src-tauri/resources/web -Recurse

      # ── 3. the extension + ffmpeg / ffprobe ────────────────────────────────
      - name: Extension and ffmpeg
        run: |
          Copy-Item extension desktop/src-tauri/resources/extension -Recurse
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $out = Join-Path $env:RUNNER_TEMP "ffmpeg"
          # (all of github.com/*/releases/download answered 504 for hours on 8/11) — gyan.dev as a second source
          $sources = @("https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip",
                       "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip")
          $got = $false
          foreach ($try in 1..4) {
            foreach ($src in $sources) {
              try { Invoke-WebRequest $src -OutFile $zip; $got = $true; break }
              catch { Write-Host "ffmpeg download failed from $src ($($_.Exception.Message))" }
            }
            if ($got) { break }
            Start-Sleep -Seconds (20 * $try)
          }
          if (-not $got) { throw "ffmpeg download failed from every source" }
          Expand-Archive $zip $out
          $bin = Get-ChildItem $out -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force desktop/src-tauri/resources/ffmpeg | Out-Null
          Copy-Item $bin.FullName, (Join-Path $bin.DirectoryName "ffprobe.exe") desktop/src-tauri/resources/ffmpeg
          & desktop/src-tauri/resources/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      # ── 4. the Tauri shell → DFlow_<version>_x64-setup.exe ─────────────────
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
      # The bundler downloads NSIS + nsis_tauri_utils from github.com/<owner>/<repo>/releases/download, which answered 504 for
      # hours on 8/11. The API asset endpoint kept working: fetch both there, check the SHA1s the bundler itself checks
      # (tauri-bundler nsis/mod.rs, CLI 2.12.4) and lay them out where it looks (%LOCALAPPDATA%\tauri\NSIS) — it then skips
      # its own download. Any failure here just leaves the bundler to try on its own.
      - name: NSIS toolset (prefetch)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tools = Join-Path $env:LOCALAPPDATA "tauri"
          $nsis = Join-Path $tools "NSIS"
          if (Test-Path (Join-Path $nsis "Plugins/x86-unicode/additional/nsis_tauri_utils.dll")) { Write-Host "NSIS already there"; exit 0 }
          function Get-Asset($repo, $tag, $name, $sha1, $out) {
            $auth = @{ Authorization = "Bearer $env:GH_TOKEN" }
            $id = ((Invoke-RestMethod "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $auth).assets | Where-Object name -eq $name).id
            foreach ($try in 1..4) {
              try {
                Invoke-WebRequest "https://api.github.com/repos/$repo/releases/assets/$id" -OutFile $out `
                  -Headers @{ Accept = "application/octet-stream"; Authorization = "Bearer $env:GH_TOKEN" }
                if ((Get-FileHash $out -Algorithm SHA1).Hash -eq $sha1) { return }
                Write-Host "${name}: wrong hash - retry $try"
              } catch { Write-Host "${name}: $($_.Exception.Message) - retry $try" }
              Start-Sleep -Seconds (10 * $try)
            }
            throw "$name could not be fetched"
          }
          New-Item -ItemType Directory -Force $tools | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "nsis-3.13.zip"
          Get-Asset "tauri-apps/binary-releases" "nsis-3.13" "nsis-3.13.zip" "DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E" $zip
          if (Test-Path $nsis) { Remove-Item -Recurse -Force $nsis }
          Expand-Archive $zip $tools -Force
          Rename-Item (Join-Path $tools "nsis-3.13") "NSIS"
          $plugins = Join-Path $nsis "Plugins/x86-unicode/additional"
          New-Item -ItemType Directory -Force $plugins | Out-Null
          Get-Asset "tauri-apps/nsis-tauri-utils" "nsis_tauri_utils-v0.5.3" "nsis_tauri_utils.dll" "75197FEE3C6A814FE035788D1C34EAD39349B860" (Join-Path $plugins "nsis_tauri_utils.dll")
          Get-ChildItem $nsis | Select-Object -First 8 | Format-Table Name

      - name: Installer (Tauri)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci --prefix desktop --no-audit --no-fund
          Push-Location desktop
          # the bundler downloads NSIS from GitHub releases — retry when that times out (504, seen 8/11)
          foreach ($try in 1..3) {
            npx tauri build
            if ($LASTEXITCODE -eq 0) { break }
            if ($try -eq 3) { exit 1 }
            Write-Host "tauri build failed - retry $try"; Start-Sleep -Seconds (30 * $try)
          }
          Pop-Location
          Get-ChildItem desktop/src-tauri/target/release/bundle/nsis | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: DFlow-Setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish the update (tags only) → dflow-releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $ver = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$ver" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} is not the app version v$ver — bump desktop/src-tauri/tauri.conf.json first" }
          $exe = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          $sig = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
          $url = "https://github.com/hoangduytn1703/dflow-releases/releases/download/v$ver/$($exe.Name)"
          $notes = (git log -1 --pretty=%s)
          $target = @{ signature = $sig; url = $url }
          $latest = [ordered]@{
            version = $ver
            notes = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{ "windows-x86_64-nsis" = $target; "windows-x86_64" = $target }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8NoBOM
          gh release create "v$ver" $exe.FullName latest.json --repo hoangduytn1703/dflow-releases `
            --title "DFlow $ver" --notes "$notes" --latest
